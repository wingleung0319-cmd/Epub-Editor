<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birdy EPUB Converter · TXT 轉 EPUB + 繁簡轉換</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f6f7f9;margin:0;color:#111}
  header{background:#111;color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header .left h1{margin:0;font-size:22px}
  header .left p{margin:6px 0 0;opacity:.8;font-size:14px}
  .version{background:#333;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  label{display:block;font-weight:700;margin:12px 0 6px}
  input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:15px}
  textarea{min-height:280px;line-height:1.7}
  button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#111;color:#fff;width:100%;margin-top:12px}
  button.secondary{background:#eee;color:#111}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  .chapters{max-height:300px;overflow:auto;border:1px solid #eee;border-radius:10px;padding:8px}
  .chapters div{padding:8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
  .chapters div.active{background:#fff3c4}
  .preview{white-space:pre-wrap;line-height:1.8;max-height:420px;overflow:auto;background:#fafafa;padding:12px;border-radius:10px}
  .small{font-size:13px;color:#666}
  .ok{color:#0a7;font-weight:600}
  .warn{color:#c60;font-weight:600}
  .err{color:#c00;font-weight:600}
  .loading-bar{height:4px;background:#eee;border-radius:2px;margin:8px 0;overflow:hidden}
  .loading-bar > div{height:100%;width:30%;background:#111;animation:load 1.2s infinite ease-in-out}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
</style>
</head>
<body>
<header>
  <div class="left">
    <h1>Birdy EPUB Converter</h1>
    <p>TXT 轉 EPUB + 繁簡轉換 · 全部喺瀏覽器本地做，唔上傳</p>
  </div>
  <div class="version" title="OpenCC 完整字典 + 香港 hkp 詞組">v1.2.0</div>
</header>

<div style="max-width:1100px;margin:16px auto 0;padding:0 16px">
  <div class="card" style="border:2px solid #111">
    <h2 style="margin:0">🔄 繁簡轉換測試</h2>
    <p class="small">必須等 OpenCC 完整字典載入完成先轉換，否則會留簡體。狀態變綠先㩒掣。</p>
    <div id="loadStatus" class="small warn">⏳ 載入 OpenCC 完整字庫中（約 1MB，第一次要幾秒）…</div>
    <div class="loading-bar" id="loadBar"><div></div></div>
    <textarea id="convTestIn" style="min-height:90px">这是一个例子，认识这个世界，为什么会来到这里？头发后面里面软件网络发展发现 服务器 鼠标 视频 软件 体验证 衔蝉 服务器鼠标视频软件网络</textarea>
    <div class="row">
      <button id="btnS2T" type="button" disabled>簡體 → 繁體 (HK)</button>
      <button id="btnT2S" type="button" class="secondary" disabled>繁體 → 簡體</button>
    </div>
    <textarea id="convTestOut" style="min-height:90px" readonly placeholder="轉換結果會喺呢度"></textarea>
    <p id="convTestMsg" class="small">未測試</p>
    <button id="btnUseResult" type="button" class="secondary" disabled>將轉換結果送去下面做 EPUB →</button>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h2 style="margin:0">1. 輸入文字</h2>
    <label>上傳 TXT</label>
    <input type="file" id="file" accept=".txt,text/plain">
    <label>或直接貼文字</label>
    <textarea id="input" placeholder="貼入小說內文…

第1章 開始
內容…

第2章 …"></textarea>
    <label>書名</label>
    <input id="title" value="我的小說">
    <label>作者</label>
    <input id="author" value="作者">
    <label>繁簡轉換</label>
    <select id="conv">
      <option value="none">不轉換</option>
      <option value="s2t">簡體 → 繁體 (香港 hkp，含詞組)</option>
      <option value="s2t_tw">簡體 → 繁體 (台灣 twp，含詞組)</option>
      <option value="t2s">繁體 → 簡體</option>
    </select>
    <label>分章規則</label>
    <select id="split">
      <option value="auto">自動分章（第X章 / 第X回 / Chapter）</option>
      <option value="one">成書一章</option>
    </select>
    <button id="previewBtn" disabled>預覽轉換 + 分章</button>
    <button id="downloadBtn" class="secondary" disabled>⬇ 生成並下載 EPUB</button>
    <p class="small" id="mainStatus">請等 OpenCC 載入完成後再操作</p>
  </div>
  <div class="card">
    <h2 style="margin:0">2. 預覽</h2>
    <p class="small" id="stats">未預覽</p>
    <h3>章節列表</h3>
    <div class="chapters" id="chapters"><div>按「預覽」先</div></div>
    <h3>內容預覽（點章節可切換）</h3>
    <div class="preview" id="preview">—</div>
  </div>
</div>

<script>
/* ========== OpenCC 載入 ========== */
let ccS2T = null, ccS2T_tw = null, ccT2S = null;
let openccReady = false;
const APP_VERSION = "1.2.0";

function setStatus(msg, cls) {
  const el = document.getElementById("loadStatus");
  if (el) { el.textContent = msg; el.className = "small " + (cls || ""); }
  const main = document.getElementById("mainStatus");
  if (main) main.textContent = msg;
}

function enableUI(ready) {
  openccReady = ready;
  ["btnS2T","btnT2S","btnUseResult","previewBtn","downloadBtn"].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !ready;
  });
  const bar = document.getElementById("loadBar");
  if (bar) bar.style.display = ready ? "none" : "block";
}

function tryInitConverters() {
  if (typeof OpenCC === "undefined" || !OpenCC.Converter) return false;
  try {
    // hkp = 香港繁體 + 詞組（滑鼠、伺服器、軟件…）
    ccS2T = OpenCC.Converter({ from: "cn", to: "hkp" });
    ccS2T_tw = OpenCC.Converter({ from: "cn", to: "twp" });
    ccT2S = OpenCC.Converter({ from: "hk", to: "cn" });
    // 快速自測
    const test = ccS2T("软件鼠标服务器");
    if (!test || test.indexOf("软件") !== -1) {
      console.warn("self-test failed", test);
      return false;
    }
    return true;
  } catch (e) {
    console.error("Converter init error", e);
    return false;
  }
}

function loadOpenCC() {
  const urls = [
    "https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/full.js",
    "https://cdn.jsdelivr.net/npm/opencc-js@1.4.1/dist/umd/full.js",
    "https://unpkg.com/opencc-js@1.4.2/dist/umd/full.js"
  ];
  let i = 0;
  function next() {
    if (i >= urls.length) {
      setStatus("❌ OpenCC 載入失敗（可能被網絡攔截）。請換瀏覽器或稍後再試。", "err");
      enableUI(false);
      return;
    }
    const s = document.createElement("script");
    s.src = urls[i++];
    s.onload = function () {
      if (tryInitConverters()) {
        setStatus("✅ OpenCC 完整字庫已就緒（v" + APP_VERSION + " · 香港 hkp / 台灣 twp）", "ok");
        enableUI(true);
      } else {
        setStatus("⚠️ OpenCC 腳本載入但初始化失敗，重試下一個來源…", "warn");
        next();
      }
    };
    s.onerror = function () {
      setStatus("載入失敗，嘗試下一個 CDN… (" + i + "/" + urls.length + ")", "warn");
      next();
    };
    document.head.appendChild(s);
  }
  next();
}

loadOpenCC();

/* ========== 轉換 ========== */
function convert(text, mode) {
  if (!text || mode === "none") return text;
  if (!openccReady || !ccS2T) {
    throw new Error("OpenCC 尚未就緒，請等載入完成（狀態變綠）後再轉");
  }
  if (mode === "s2t") return ccS2T(text);
  if (mode === "s2t_tw") return ccS2T_tw(text);
  if (mode === "t2s") return ccT2S(text);
  return text;
}

/* ========== 分章 ========== */
let chapters = [];
function splitChapters(text) {
  const lines = text.split(/\r?\n/);
  const re = /^\s*(第[一二三四五六七八九十百千零〇\d]+[章回卷節篇]|Chapter\s*\d+|序章|楔子|番外|前言|終章|後記|第\d+章)/i;
  let cur = { title: "開頭", content: [] };
  let out = [];
  lines.forEach(l => {
    if (re.test(l.trim()) && l.trim().length < 80) {
      if (cur.content.join("\n").trim() || cur.title !== "開頭") out.push(cur);
      cur = { title: l.trim(), content: [] };
    } else {
      cur.content.push(l);
    }
  });
  out.push(cur);
  if (out.length === 1 && document.getElementById("split").value === "one") return out;
  if (out.length > 1 && !out[0].content.join("").trim()) out.shift();
  return out;
}

function render() {
  const list = document.getElementById("chapters");
  list.innerHTML = "";
  chapters.forEach((c, i) => {
    const d = document.createElement("div");
    d.textContent = (i + 1) + ". " + c.title + " (" + c.content.join("\n").length + "字)";
    d.onclick = () => {
      document.querySelectorAll(".chapters div").forEach(e => e.classList.remove("active"));
      d.classList.add("active");
      document.getElementById("preview").textContent = c.title + "\n\n" + c.content.join("\n");
    };
    if (i === 0) d.click();
    list.appendChild(d);
  });
}

/* ========== 事件 ========== */
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById("input").value = r.result; };
  r.readAsText(f, "UTF-8");
});

document.getElementById("previewBtn").onclick = () => {
  try {
    const raw = document.getElementById("input").value.trim();
    if (!raw) { alert("請先貼文字或上傳 TXT"); return; }
    const conv = document.getElementById("conv").value;
    const txt = convert(raw, conv);
    if (conv !== "none" && txt !== raw) {
      document.getElementById("input").value = txt;
    }
    chapters = splitChapters(txt);
    document.getElementById("stats").textContent =
      "共 " + chapters.length + " 章 · 全文 " + txt.length + " 字 · 轉換：" +
      document.getElementById("conv").selectedOptions[0].text;
    render();
  } catch (e) {
    alert(e.message);
  }
};

document.getElementById("conv").addEventListener("change", () => {
  if (openccReady) document.getElementById("previewBtn").click();
});

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function xhtml(title, body) {
  return '<?xml version="1.0" encoding="utf-8"?>\n' +
    '<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml">' +
    '<head><title>' + esc(title) + '</title>' +
    '<link rel="stylesheet" href="../Styles/style.css"/></head>' +
    '<body><h1>' + esc(title) + '</h1>' +
    body.split(/\n\s*\n/).map(p => "<p>" + esc(p).replace(/\n/g, "<br/>") + "</p>").join("") +
    '</body></html>';
}

document.getElementById("downloadBtn").onclick = async () => {
  try {
    document.getElementById("previewBtn").click();
    if (!chapters.length) return;
    const title = document.getElementById("title").value || "我的小說";
    const author = document.getElementById("author").value || "作者";
    const zip = new JSZip();
    zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
    zip.folder("META-INF").file("container.xml",
      '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">' +
      '<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    const oebps = zip.folder("OEBPS");
    oebps.folder("Styles").file("style.css",
      "body{font-family:serif;line-height:1.8;margin:5%}h1{font-size:1.4em}p{text-indent:2em;margin:.5em 0}");
    let manifest = "", spine = "", toc = "";
    chapters.forEach((c, i) => {
      const fn = "Text/ch" + (i + 1) + ".xhtml";
      oebps.file(fn, xhtml(c.title, c.content.join("\n")));
      manifest += '<item id="ch' + (i + 1) + '" href="' + fn + '" media-type="application/xhtml+xml"/>';
      spine += '<itemref idref="ch' + (i + 1) + '"/>';
      toc += '<navPoint id="np' + (i + 1) + '" playOrder="' + (i + 1) + '">' +
        '<navLabel><text>' + esc(c.title) + '</text></navLabel><content src="' + fn + '"/></navPoint>';
    });
    oebps.file("Text/nav.xhtml",
      '<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html>' +
      '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">' +
      '<head><title>目錄</title></head><body><nav epub:type="toc"><ol>' +
      chapters.map((c, i) => '<li><a href="Text/ch' + (i + 1) + '.xhtml">' + esc(c.title) + '</a></li>').join("") +
      '</ol></nav></body></html>');
    oebps.file("content.opf",
      '<?xml version="1.0" encoding="UTF-8"?>' +
      '<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="bookid" version="3.0">' +
      '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">' +
      '<dc:title>' + esc(title) + '</dc:title>' +
      '<dc:creator>' + esc(author) + '</dc:creator>' +
      '<dc:language>zh-Hant</dc:language>' +
      '<dc:identifier id="bookid">urn:uuid:' + Date.now() + '</dc:identifier>' +
      '</metadata><manifest>' +
      '<item id="nav" href="Text/nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>' +
      manifest +
      '<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>' +
      '</manifest><spine>' + spine + '</spine></package>');
    oebps.file("toc.ncx",
      '<?xml version="1.0" encoding="UTF-8"?>' +
      '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">' +
      '<head></head><docTitle><text>' + esc(title) + '</text></docTitle><navMap>' + toc + '</navMap></ncx>');
    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = title + ".epub";
    a.click();
  } catch (e) {
    alert(e.message);
  }
};

/* 測試區 */
document.getElementById("btnS2T").onclick = () => {
  try {
    const inp = document.getElementById("convTestIn").value;
    const out = convert(inp, "s2t");
    document.getElementById("convTestOut").value = out;
    const changed = [...inp].filter((c, i) => c !== out[i]).length;
    const remain = (out.match(/[这国时会来对说过还进开关东车书长门问间见头发后里面软网络发现认知识觉得知道听说请读写学习电脑手机视频鼠标服务器体验证衔蝉]/g) || []).length;
    document.getElementById("convTestMsg").innerHTML =
      "簡→繁完成：全文 " + inp.length + " 字，轉咗約 " + changed + " 個位置。" +
      (remain ? ' <span class="warn">仍偵測到 ' + remain + ' 個常見簡體字元</span>' :
        ' <span class="ok">✓ 常見簡體已全部轉換</span>');
  } catch (e) {
    alert(e.message);
  }
};

document.getElementById("btnT2S").onclick = () => {
  try {
    const inp = document.getElementById("convTestIn").value;
    const out = convert(inp, "t2s");
    document.getElementById("convTestOut").value = out;
    const changed = [...inp].filter((c, i) => c !== out[i]).length;
    document.getElementById("convTestMsg").textContent =
      "繁→簡完成：全文 " + inp.length + " 字，轉咗約 " + changed + " 個位置。";
  } catch (e) {
    alert(e.message);
  }
};

document.getElementById("btnUseResult").onclick = () => {
  const out = document.getElementById("convTestOut").value;
  if (!out) { alert("請先㩒上面轉換掣"); return; }
  document.getElementById("input").value = out;
  document.getElementById("conv").value = "none";
  document.getElementById("previewBtn").click();
  window.scrollTo(0, document.body.scrollHeight);
  alert("已送去下面，繁簡轉換已設為「不轉換」");
};

window.addEventListener("load", () => {
  document.getElementById("input").value =
    "第1章 開始\n這是一個範例。認識這個世界，為什麼會來到這裡？\n後面還有很多故事。\n\n第2章 繼續\n這裡是第二章的內容，看到這裡就代表分章成功了。";
});
</script>
</body>
</html>
