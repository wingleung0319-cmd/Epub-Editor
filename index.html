<body><header><h1>EPUB Editor</h1><p>TXT 轉 EPUB + 繁簡轉換 · 全部喺瀏覽器本地做，唔上傳</p></header>
<div class="wrap">
<div class="card"><h2 style="margin:0">1. 輸入文字</h2>
<label>上傳 TXT</label><input type="file" id="file" accept=".txt,text/plain">

<label>書名</label><input id="title" value="我的小說">

function convert(text,mode){
 if(mode==="none") return text;
 let phrase = mode==="s2t"?PHRASE_S2T:PHRASE_T2S;
 let map = mode==="s2t"?S2T:null;
 if(mode==="t2s"){ map={}; for(let k in S2T) map[S2T[k]]=k; }
 for(let k in phrase) text=text.split(k).join(phrase[k]);
 if(map) text=text.split("").map(c=>map[c]||c).join("");
 return text;
}
let chapters=[];
function splitChapters(text){
 const lines=text.split(/\r?\n/);
 const re=/^\s*(第[一二三四五六七八九十百千\d]+[章回卷節篇]|Chapter\s*\d+|序章|楔子|番外|前言|終章|後記|第\d+章)/;
 let cur={title:"開頭",content:[]};
 let out=[];
 lines.forEach(l=>{
   if(re.test(l.trim()) && l.trim().length<60){
     if(cur.content.join("\n").trim()||cur.title!=="開頭") out.push(cur);
     cur={title:l.trim(),content:[]};
   } else cur.content.push(l);
 });
 out.push(cur);
 if(out.length===1 && document.getElementById("split").value==="one") return out;
 // 若第一章為空開頭，移除
 if(out.length>1 && !out[0].content.join("").trim()) out.shift();
 return out;
}
function render(){
 const list=document.getElementById("chapters"); list.innerHTML="";
 chapters.forEach((c,i)=>{let d=document.createElement("div");d.textContent=(i+1)+". "+c.title+" ("+c.content.join("\n").length+"字)";d.onclick=()=>{document.querySelectorAll(".chapters div").forEach(e=>e.classList.remove("active"));d.classList.add("active");document.getElementById("preview").textContent=c.title+"\n\n"+c.content.join("\n");};if(i===0)d.click();list.appendChild(d);});
}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById("input").value=r.result;};r.readAsText(f);});
document.getElementById("previewBtn").onclick=()=>{
 let raw=document.getElementById("input").value.trim(); if(!raw){alert("請先貼文字或上傳 TXT");return;}
 let conv=document.getElementById("conv").value;
 let txt=convert(raw,conv);
 // FIX: 讓轉換睇得見 - 將轉換後文字寫返入左邊文字框，並保留原文對照
 if(conv!=="none" && txt!==raw){ document.getElementById("input").value=txt; }
 chapters=splitChapters(txt);
 document.getElementById("stats").textContent="共 "+chapters.length+" 章 · 全文 "+txt.length+" 字 · 轉換："+document.getElementById("conv").selectedOptions[0].text;
 render();
};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function xhtml(title,body){return '<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>'+esc(title)+'</title><link rel="stylesheet" href="../Styles/style.css"/></head><body><h1>'+esc(title)+'</h1>'+body.split(/\n\s*\n/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br/>")+"</p>").join("")+'</body></html>';}
document.getElementById("conv").addEventListener("change",()=>{ document.getElementById("previewBtn").click(); });
document.getElementById("downloadBtn").onclick=async()=>{
 if(!chapters.length) document.getElementById("previewBtn").click();
 if(!chapters.length) return;
 let title=document.getElementById("title").value||"我的小說";
 let author=document.getElementById("author").value||"作者";
 let zip=new JSZip();
 zip.file("mimetype","application/epub+zip",{compression:"STORE"});
 zip.folder("META-INF").file("container.xml",'<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
 let oebps=zip.folder("OEBPS"); oebps.folder("Styles").file("style.css","body{font-family:serif;line-height:1.8;margin:5%}h1{font-size:1.4em}p{text-indent:2em;margin:.5em 0}");
 let manifest="",spine="",toc="";
 chapters.forEach((c,i)=>{let fn="Text/ch"+(i+1)+".xhtml";oebps.file(fn,xhtml(c.title,c.content.join("\n")));manifest+='<item id="ch'+(i+1)+'" href="'+fn+'" media-type="application/xhtml+xml"/>';spine+='<itemref idref="ch'+(i+1)+'"/>';toc+='<navPoint id="np'+(i+1)+'" playOrder="'+(i+1)+'"><navLabel><text>'+esc(c.title)+'</text></navLabel><content src="'+fn+'"/></navPoint>';});
 oebps.file("Text/nav.xhtml",'<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>目錄</title></head><body><nav epub:type="toc"><ol>'+chapters.map((c,i)=>'<li><a href="Text/ch'+(i+1)+'.xhtml">'+esc(c.title)+'</a></li>').join("")+'</ol></nav></body></html>');
 oebps.file("content.opf",'<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" unique-identifier="bookid" version="3.0"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+esc(title)+'</dc:title><dc:creator>'+esc(author)+'</dc:creator><dc:language>zh-Hant</dc:language><dc:identifier id="bookid">urn:uuid:'+Date.now()+'</dc:identifier></metadata><manifest><item id="nav" href="Text/nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'+manifest+'<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/></manifest><spine>'+spine+'</spine></package>');
 oebps.file("toc.ncx",'<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head></head><docTitle><text>'+esc(title)+'</text></docTitle><navMap>'+toc+'</navMap></ncx>');

 let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=title+".epub";a.click();
