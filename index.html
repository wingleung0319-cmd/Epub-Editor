function findRemainingSimplified(text){
  // 簡體獨有字集：只要仲有呢啲字，就代表未轉晒
  let simpOnly = Object.keys(EXTRA_S2T);
  let found = [];
  for(let c of new Set(text)){ if(EXTRA_S2T[c] && c!==EXTRA_S2T[c]) found.push(c+"→"+EXTRA_S2T[c]); }
  return found;
}

// === 完全轉換：優先用 OpenCC 全字庫（幾千字 + 詞組），唔用細對照表 ===
let _ccS2T=null, _ccT2S=null;
function getCC(mode){
  try{
    if(typeof OpenCC==="undefined") return null;
    if(mode==="s2t"){ if(!_ccS2T){ try{_ccS2T=OpenCC.Converter({from:"cn",to:"tw"});}catch(e){ try{_ccS2T=OpenCC.Converter({from:"cn",to:"t"});}catch(e2){_ccS2T=OpenCC.Converter({from:"cn",to:"hk"});}}} return _ccS2T; }
    if(mode==="t2s"){ if(!_ccT2S) _ccT2S=OpenCC.Converter({from:"tw",to:"cn"}); return _ccT2S; }
  }catch(e){ return null; }
  return null;
}
function convert(text,mode){
 if(mode==="none") return text;
 // 1) OpenCC 全轉換
 let cc=getCC(mode);
 if(cc){ try{ let out=cc.convert(text); if(out){ for(let k in EXTRA_S2T) out=out.split(k).join(EXTRA_S2T[k]); return out; } }catch(e){} }
 // 2) Fallback: 舊對照表（OpenCC 未 load 到先用）
 let phrase = mode==="s2t"?PHRASE_S2T:PHRASE_T2S;
 let map = mode==="s2t"?S2T:null;
 if(mode==="t2s"){ map={}; for(let k in S2T) map[S2T[k]]=k; }
 for(let k in phrase) text=text.split(k).join(phrase[k]); if(mode==="s2t"){ for(let k in EXTRA_S2T) text=text.split(k).join(EXTRA_S2T[k]); }
 if(map) text=text.split("").map(c=>map[c]||c).join("");
 return text;
}
function convertInfo(){
  if(typeof OpenCC!=="undefined") return "OpenCC 全字庫已載入";
  return "OpenCC 載入中 / 已用備用表";
}
let chapters=[];
function splitChapters(text){
 const lines=text.split(/\r?\n/);
 const re=/^\s*(第[一二三四五六七八九十百千\d]+[章回卷節篇]|Chapter\s*\d+|序章|楔子|番外|前言|終章|後記|第\d+章)/;
 let cur={title:"開頭",content:[]};
 let out=[];
 lines.forEach(l=>{
   if(re.test(l.trim()) && l.trim().length<60){
     if(cur.content.join("\n").trim()||cur.title!=="開頭") out.push(cur);
     cur={title:l.trim(),content:[]};
   } else cur.content.push(l);
 });
 out.push(cur);
 if(out.length===1 && document.getElementById("split").value==="one") return out;
 // 若第一章為空開頭，移除
 if(out.length>1 && !out[0].content.join("").trim()) out.shift();
 return out;
}

}
